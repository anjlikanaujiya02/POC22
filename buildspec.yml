version: 0.2
 
phases:
  install:
    commands:
      - echo Installing dependencies
      - npm install
 
  build:
    commands:
      - echo Build completed
 
  post_build:
    commands:
      - echo Setting up SSH key
      - printf "%s\n" "$EC2_KEY" > key.pem
      - chmod 400 key.pem
 
      - echo Deploying to EC2
      - ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@32.198.49.66 "cd POC22 || git clone https://github.com/anjlikanaujiya02/POC22.git && cd poc22-nodejs-app && git pull && npm install && pkill node || true && nohup node app.js > app.log 2>&1 &"
